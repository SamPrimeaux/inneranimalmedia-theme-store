name: Verify Theme Store
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: node --check bin/iam-theme.mjs
      - run: node --check scripts/publish-theme-packages.mjs
      - run: node --test tests/npm-child-environment.test.mjs
      - name: Test imported theme source packages
        run: find packages -path '*/test/*.test.mjs' -type f -print0 | xargs -0 node --test
