name: Publish Theme Store
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/theme-plain-jane/source/**'
      - 'packages/theme-plain-jane/package.json'
      - 'packages/theme-plain-jane/prebuild.json'
      - 'packages/theme-plain-jane/src/**'
      - 'scripts/publish-theme-packages.mjs'
      - '.github/workflows/publish.yml'
permissions:
  contents: write
concurrency:
  group: theme-store-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Checkout Theme Store source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install store and Plain Jane dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix packages/theme-plain-jane/source
      - name: Build reviewed authored site and CMS manifest
        run: npm run build --prefix packages/theme-plain-jane
      - name: Test generated Plain Jane pages and media
        run: |
          node --test packages/theme-plain-jane/test/*.test.mjs
          node --check scripts/build-theme-release.mjs
      - name: Publish digest-addressed Plain Jane ZIP and verify R2 round trip
        run: node scripts/build-theme-release.mjs plain-jane --publish
      - name: Publish complete versioned Plain Jane preview to R2
        run: node scripts/publish-theme-packages.mjs --only=plain-jane
      - name: Build Theme Store with verified published release metadata
        run: |
          npm run check
          npm run build
          node --test packages/theme-plain-jane/test/*.test.mjs
      - name: Deploy Worker with verified download and preview
        run: npx wrangler deploy
      - name: Verify live versioned artifact and preview
        shell: bash
        run: |
          set -euo pipefail
          root="https://themes.inneranimalmedia.com"
          curl -fsSL "$root/api/catalog" | grep -q 'plain-jane'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/" | grep -q '<html'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/post/how-to-measure-business-growth-key-performance-metrics" | grep -q '<html'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/images/how-to-measure-business-growth-key-performance-metrics-navy-chart.svg" | grep -q '<svg'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/images/sustainable-business-growth-strategies-lasting-momentum-green-chart.svg" | grep -q '<svg'
          curl -fsSL "$root/api/themes/plain-jane/0.1.1/manifest.json" | grep -q '"version":"0.1.1"'
          curl -fsSL "$root/api/themes/plain-jane/0.1.1/download" -o /tmp/plain-jane-0.1.1.zip
          test -s /tmp/plain-jane-0.1.1.zip
          node -e 'const fs=require("fs"),c=require("crypto"); const p=JSON.parse(fs.readFileSync("packages/theme-plain-jane/package.json"));const hash=c.createHash("sha256").update(fs.readFileSync("/tmp/plain-jane-0.1.1.zip")).digest("hex");if(hash!==p.agentsam.store.release.sha256)process.exit(1)'
      - name: Record generated release artifacts back to source of truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/theme-plain-jane/site packages/theme-plain-jane/package.json src/catalog.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(plain-jane): record verified v0.1.1 compiled release [skip ci]"
            git push origin HEAD:main
          fi
