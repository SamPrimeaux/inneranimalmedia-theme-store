name: Publish Theme Store
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/theme-plain-jane/source/**'
      - 'packages/theme-plain-jane/package.json'
      - 'packages/theme-plain-jane/prebuild.json'
      - 'packages/theme-plain-jane/src/**'
      - 'scripts/build-theme-release.mjs'
      - 'scripts/publish-theme-packages.mjs'
      - '.github/workflows/publish.yml'
permissions:
  contents: write
concurrency:
  group: theme-store-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Theme Store
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source and store dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-audit --no-fund --prefix packages/theme-plain-jane/source
      - name: Compile Plain Jane source, local images and CMS manifest
        run: npm run build --prefix packages/theme-plain-jane
      - name: Test all article routes and assets
        run: |
          node --test packages/theme-plain-jane/test/*.test.mjs
          node --check scripts/build-theme-release.mjs
      - name: Build and verify reproducible compiled-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-theme-release.mjs plain-jane
          first="$(sha256sum .releases/plain-jane-0.1.1.zip | cut -d' ' -f1)"
          node scripts/build-theme-release.mjs plain-jane
          second="$(sha256sum .releases/plain-jane-0.1.1.zip | cut -d' ' -f1)"
          test "$first" = "$second"
          unzip -t .releases/plain-jane-0.1.1.zip
          unzip -Z -1 .releases/plain-jane-0.1.1.zip | grep -q '^site/post/how-to-measure-business-growth-key-performance-metrics/index.html$'
          unzip -Z -1 .releases/plain-jane-0.1.1.zip | grep -q '^site/images/sustainable-business-growth-strategies-lasting-momentum-green-chart.svg$'
          echo "Plain Jane compiled archive SHA-256: $first"
      - name: Attach portable preset to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: plain-jane-journal-0.1.1
          path: .releases/plain-jane-0.1.1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable downloadable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="theme-plain-jane-v0.1.1"
          file=".releases/plain-jane-0.1.1.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/plain-jane-existing-release
            gh release download "$tag" --pattern "plain-jane-0.1.1.zip" --dir /tmp/plain-jane-existing-release
            cmp "$file" /tmp/plain-jane-existing-release/plain-jane-0.1.1.zip
            echo "Previously published immutable release verified."
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" \
              --title "Plain Jane Journal · 0.1.1" \
              --notes "Reviewed compiled-only editorial theme. Includes 14 CMS preview pages and the Growth & Performance light/dark illustrations. Source and npm package are not part of this distribution. Draft content is not a published platform article."
          fi
      - name: Check Cloudflare release credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy credentials unavailable; verified GitHub release remains downloadable. Theme Store live endpoint is unchanged."
          fi
      - name: Upload checksum-addressed ZIP to Cloudflare R2
        if: steps.cloudflare.outputs.enabled == 'true'
        run: node scripts/build-theme-release.mjs plain-jane --publish
      - name: Upload complete versioned R2 preview
        if: steps.cloudflare.outputs.enabled == 'true'
        run: node scripts/publish-theme-packages.mjs --only=plain-jane
      - name: Build catalog using verified release metadata
        run: |
          npm run check
          npm run build
          node --test packages/theme-plain-jane/test/*.test.mjs
      - name: Deploy Theme Store Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npx wrangler deploy
      - name: Verify production preview and digest-checked ZIP
        if: steps.cloudflare.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="https://themes.inneranimalmedia.com"
          curl -fsSL "$root/api/catalog" | grep -q 'plain-jane'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/" | grep -q '<html'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/post/how-to-measure-business-growth-key-performance-metrics" | grep -q '<html'
          curl -fsSL "$root/theme-packages/plain-jane/0.1.1/preview/images/how-to-measure-business-growth-key-performance-metrics-navy-chart.svg" | grep -q '<svg'
          curl -fsSL "$root/api/themes/plain-jane/0.1.1/manifest.json" | grep -q '"version":"0.1.1"'
          curl -fsSL "$root/api/themes/plain-jane/0.1.1/download" -o /tmp/plain-jane-0.1.1.zip
          test -s /tmp/plain-jane-0.1.1.zip
          node -e 'const fs=require("fs"),c=require("crypto");const p=JSON.parse(fs.readFileSync("packages/theme-plain-jane/package.json"));const hash=c.createHash("sha256").update(fs.readFileSync("/tmp/plain-jane-0.1.1.zip")).digest("hex");if(hash!==p.agentsam.store.release.sha256)process.exit(1)'
      - name: Commit generated site, lockfile and verified release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/theme-plain-jane/site packages/theme-plain-jane/package.json packages/theme-plain-jane/source/package-lock.json src/catalog.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(plain-jane): record generated v0.1.1 preset [skip ci]"
            git push origin HEAD:main
          fi
