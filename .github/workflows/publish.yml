name: Publish Theme Store
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Theme package slug (owned by this repository)
        required: true
        default: iapj
        type: string
permissions:
  contents: write
concurrency:
  group: theme-store-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      THEME_SLUG: ${{ inputs.theme }}
    steps:
      - name: Checkout canonical Theme Store source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release credentials and editor contract
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Cloudflare production credentials are not connected. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. No release has been published.'
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const slug=process.env.THEME_SLUG;
          if(!/^[a-z][a-z0-9-]{0,62}$/.test(slug)) throw Error('invalid_release_slug');
          const dir='packages/theme-'+slug+'/';
          const pkg=JSON.parse(fs.readFileSync(dir+'package.json'));
          if(pkg.agentsam?.slug!==slug||pkg.agentsam?.installable!==true||!/^\d+\.\d+\.\d+$/.test(pkg.version))
            throw Error('theme_not_source_owned_installable_release:'+slug);
          if(fs.existsSync(dir+'provenance.json')){
            const approval=JSON.parse(fs.readFileSync(dir+'provenance.json'));
            if(approval.publishApproved!==true) throw Error('theme_source_release_not_reviewed:'+slug);
          }
          if(!fs.existsSync(dir+'install-project.json')) throw Error('editable_theme_project_missing:'+slug);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+pkg.version+'\n');
          console.log('Reviewed source',slug,pkg.version);
          NODE
      - name: Install Theme Store dependencies
        run: npm ci --no-audit --no-fund
      - name: Install IAPJ authored source dependencies
        if: inputs.theme == 'iapj'
        run: npm ci --no-audit --no-fund --prefix packages/theme-iapj/source
      - name: Build IAPJ React site and its CMS route inventory
        if: inputs.theme == 'iapj'
        run: npm run build --prefix packages/theme-iapj
      - uses: actions/setup-python@v5
        if: inputs.theme == 'iapj'
        with:
          python-version: '3.12'
      - name: Install browser for native IAPJ CMS extraction
        if: inputs.theme == 'iapj'
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Generate IAPJ native 31-page editable project from the SDK editor contract
        if: inputs.theme == 'iapj'
        run: |
          # The source copy is used only for the generator; it does NOT become
          # a baked-in SDK theme distribution or a separate CMS implementation.
          curl -fsSL "https://raw.githubusercontent.com/SamPrimeaux/agentsam-sdk/main/apps/ecommerce-cms-agentsam/frontend/theme-editor/project.mjs" -o /tmp/agentsam-theme-editor-project.mjs
          python packages/theme-iapj/scripts/export-install-project.py \
            --contract /tmp/agentsam-theme-editor-project.mjs
      - name: Verify source contracts and compile Theme Store
        run: |
          npm run check
          npm run build
          npm test
          find packages -path '*/test/*.test.mjs' -type f -print0 | xargs -0 node --test
      - name: Generate reproducible immutable ZIP and matching editable-project receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-theme-release.mjs "$THEME_SLUG"
          zip=".releases/${THEME_SLUG}-${{ steps.release.outputs.version }}.zip"
          first=$(sha256sum "$zip" | cut -d' ' -f1)
          node scripts/build-theme-release.mjs "$THEME_SLUG"
          second=$(sha256sum "$zip" | cut -d' ' -f1)
          test "$first" = "$second"
          unzip -t "$zip" >/dev/null
          if [[ "$THEME_SLUG" == 'iapj' ]]; then
            node packages/theme-iapj/scripts/finalize-install-project.mjs
            node --test packages/theme-iapj/test/*.test.mjs
          fi
          echo "Reviewed ZIP digest: $first"
      - name: Publish and round-trip verify immutable ZIP in Theme Store R2
        run: node scripts/build-theme-release.mjs "$THEME_SLUG" --publish
      - name: Register and round-trip verify native CMS install-project in Theme Store R2
        run: node scripts/publish-install-projects.mjs
      - name: Publish complete versioned preview to Theme Store R2
        run: node scripts/publish-theme-packages.mjs "--only=$THEME_SLUG"
      - name: Deploy Theme Store Worker and authoritative catalog
        run: |
          npm run build
          npx wrangler deploy
      - name: Verify public catalog, ZIP and editable project as one installable release
        run: node scripts/verify-published-installations.mjs --min 11
      - name: Publish verified download to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          tag="theme-${THEME_SLUG}-v${{ steps.release.outputs.version }}"
          file=".releases/${THEME_SLUG}-${{ steps.release.outputs.version }}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/old-release
            gh release download "$tag" --pattern "$(basename "$file")" --dir /tmp/old-release
            cmp "$file" "/tmp/old-release/$(basename "$file")"
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" \
              --title "${THEME_SLUG} · ${{ steps.release.outputs.version }}" \
              --notes 'Verified Theme Store source release. Installable via the authenticated account-owned Theme Studio without a CMS site. Editable CMS project is distributed via checksum-verified Theme Store R2.'
          fi
      - name: Commit verified release metadata back to Theme Store source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "packages/theme-${THEME_SLUG}/package.json" "packages/theme-${THEME_SLUG}/install-project.json"
          git diff --cached --quiet && exit 0
          git commit -m "release(${THEME_SLUG}): record verified R2 ZIP and editable project"
          git push origin HEAD:main
